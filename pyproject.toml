[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dfir-casekit"
version = "1.0.0"
description = "Evidence-to-report DFIR triage: chain of custody, Sigma detection, PCAP analysis, ATT&CK-mapped incident reports."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = ["PyYAML>=6.0"]

[project.optional-dependencies]
evtx = ["python-evtx>=0.7"]
dev = ["pytest>=8"]

[project.scripts]
casekit = "casekit.cli:main"

[tool.setuptools.packages.find]
include = ["casekit*"]

[tool.setuptools.package-data]
casekit = ["rules/**/*.yml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
