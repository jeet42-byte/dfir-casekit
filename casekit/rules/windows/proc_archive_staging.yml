title: Data staged into an archive with a command-line archiver
id: ck-win-008
status: stable
description: 7-Zip / RAR created an archive from the command line, commonly password-protected, to stage data for exfiltration.
author: DFIR CaseKit
level: medium
tags: [attack.collection, attack.t1560.001]
logsource: {product: windows, category: process_creation}
detection:
  selection:
    Image|endswith: ['\7z.exe', '\7za.exe', '\7zr.exe', '\rar.exe', '\winrar.exe']
    CommandLine|contains: ' a '
  condition: selection
