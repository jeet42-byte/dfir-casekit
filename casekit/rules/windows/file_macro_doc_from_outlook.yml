title: Macro-enabled Office document saved from an email attachment
id: ck-win-021
status: stable
description: Outlook wrote a macro-enabled document (.docm/.xlsm/.pptm) into its attachment cache - the delivery step of a spearphishing attachment.
author: DFIR CaseKit
level: medium
tags: [attack.initial_access, attack.t1566.001]
logsource: {product: windows, category: file_event}
detection:
  selection:
    Image|endswith: '\OUTLOOK.EXE'
    TargetFilename|endswith: ['.docm', '.xlsm', '.pptm', '.dotm', '.xlam']
  condition: selection
