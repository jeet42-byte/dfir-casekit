title: Office application spawned a shell or script host
id: ck-win-001
status: stable
description: |
  A Microsoft Office process started a command interpreter or LOLBin. Office documents have no
  legitimate reason to launch PowerShell or cmd; this is the classic execution step of a
  macro-enabled phishing attachment.
author: DFIR CaseKit
level: high
tags: [attack.initial_access, attack.t1566.001, attack.execution, attack.t1204.002]
logsource: {product: windows, category: process_creation}
detection:
  selection_parent:
    ParentImage|endswith: ['\WINWORD.EXE', '\EXCEL.EXE', '\POWERPNT.EXE', '\OUTLOOK.EXE', '\MSACCESS.EXE']
  selection_child:
    Image|endswith: ['\powershell.exe', '\pwsh.exe', '\cmd.exe', '\wscript.exe', '\cscript.exe',
                     '\mshta.exe', '\rundll32.exe', '\regsvr32.exe', '\certutil.exe']
  condition: selection_parent and selection_child
falsepositives: [Rare line-of-business add-ins]
